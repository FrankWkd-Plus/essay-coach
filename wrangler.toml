name = "essay-coach"
main = "src/worker.js"
compatibility_date = "2026-11-17"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "essay-coach-db"
# Replace with the id printed by: npx wrangler d1 create essay-coach-db
database_id = "0f03816e-4ee8-41e2-8b3f-e08a153408e5"

[triggers]
crons = ["15 3 * * *"]

[vars]
AI_API_URL = "https://api.deepseek.com/chat/completions"
AI_MODEL = "deepseek-chat"
AI_JSON_MODE = "true"
WORKERS_AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"

[observability]
enabled = true
